spring:
  application:
    name: business-process-manager
  jackson:
    serialization:
      indent-output: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: business-process-framework
      auto-offset-reset: earliest
  datasource:
    url: jdbc:h2:mem:saga;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

saga:
  kafka:
    trigger-topic: business-process-trigger
  service-discovery:
    registry-base-url: http://localhost:8090
    cache-ttl: 120s

logging:
  file:
    name: ${STEPFLOW_LOG_DIR:../temp/stepflow-logs}/${spring.application.name}.json
  structured:
    format:
      file: ecs
  logback:
    rollingpolicy:
      file-name-pattern: ${logging.file.name}.%d{yyyy-MM-dd}.%i
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
