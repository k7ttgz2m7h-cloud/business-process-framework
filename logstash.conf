# One collector for all applications on this host (or mounted log directory).
input {
  file {
    id => "stepflow-applications"
    path => ["${STEPFLOW_LOG_DIR:../temp/stepflow-logs}/*.json", "${STEPFLOW_LOG_DIR:../temp/stepflow-logs}/*.json.*"]
    start_position => "beginning"
    ecs_compatibility => "v8"
    codec => json
    # Keep Logstash's persistent sincedb so restarts resume at saved offsets.
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_URL:http://localhost:9200}"]
    ecs_compatibility => "v8"
    data_stream => false
    ilm_enabled => false
    index => "stepflow-logs-%{+YYYY.MM.dd}"
    # For a secured cluster, configure credentials and its CA certificate here.
    user => "elastic"
    password => "elastic"
    # ssl_certificate_authorities => ["${ELASTICSEARCH_CA}"]
  }
}
