spring:
  application:
    name: business-process-service-registry
  config:
    import: classpath:services-registry.yml

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info

business-process-service-registry:
  check-interval-ms: 10000

logging:
  file:
    name: ${STEPFLOW_LOG_DIR:../temp/stepflow-logs}/${spring.application.name}.json
  structured:
    format:
      file: ecs
  level:
    com.businessprocess.businessprocessserviceregistry: INFO
  logback:
    rollingpolicy:
      file-name-pattern: ${logging.file.name}.%d{yyyy-MM-dd}.%i
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
